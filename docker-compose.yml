services:
  api:
    build: .
    env_file: .env
    ports:
      - "8000:8000"
    depends_on:
      qdrant-init:
        condition: service_completed_successfully
      seaweedfs-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    volumes:
      - ./storage:/app/storage
    networks:
      - default
      - dokploy-network

  # ── Local MySQL — DEV ONLY. Prod uses the Dokploy-managed DB reached
  # via `applyforge-applyforgedb-*` on `dokploy-network`. Gated behind the
  # `local` profile so it does NOT start on prod deploys (would collide with
  # the managed DB's port binding).
  # Start locally with:  docker compose --profile local up -d
  mysql:
    image: mysql:8
    profiles: ["local"]
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: applyforge
      MYSQL_USER: applyforge
      MYSQL_PASSWORD: applyforge
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 5s
      timeout: 3s
      retries: 20

  # ── Redis: Celery broker + result backend ───────────────────────────────────
  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ── Celery worker: ATS pollers + auto-apply orchestrator ────────────────────
  worker:
    build: .
    env_file: .env
    depends_on:
      redis:
        condition: service_healthy
    command: celery -A app.workers.celery_app worker --loglevel=info --concurrency=4
    volumes:
      - ./storage:/app/storage
    networks:
      - default
      - dokploy-network

  # ── Celery beat: schedules the pollers ──────────────────────────────────────
  # --schedule points at /tmp because the app runtime user can't write to /app
  # (which is where beat defaults its persistent dbm schedule file).
  beat:
    build: .
    env_file: .env
    depends_on:
      redis:
        condition: service_healthy
    command: celery -A app.workers.celery_app beat --loglevel=info --schedule=/tmp/celerybeat-schedule
    networks:
      - default
      - dokploy-network

  # ── Vector store (RAG embeddings) ───────────────────────────────────────────
  qdrant:
    image: qdrant/qdrant:latest
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/6333'"]
      interval: 5s
      timeout: 3s
      retries: 10

  # One-shot: create the Qdrant collection (idempotent) before the API starts.
  qdrant-init:
    build: .
    env_file: .env
    depends_on:
      qdrant:
        condition: service_healthy
    entrypoint: ["python", "scripts/qdrant_init.py"]
    restart: "no"

  # ── S3-compatible object storage (resume uploads) ───────────────────────────
  seaweedfs:
    image: chrislusf/seaweedfs:latest
    command: server -dir=/data -s3 -s3.port=8333
    volumes:
      - seaweed_data:/data
    healthcheck:
      test: ["CMD", "nc", "-z", "127.0.0.1", "8333"]
      interval: 5s
      timeout: 3s
      retries: 10

  # One-shot: create the upload bucket (idempotent) before the API starts.
  # Uses the S3 API (same port the app uses) rather than the filer's
  # /buckets/ REST endpoint, which is unreliable on first boot.
  seaweedfs-init:
    image: minio/mc:latest
    depends_on:
      seaweedfs:
        condition: service_healthy
    env_file: .env
    entrypoint:
      - /bin/sh
      - -c
      - |
        mc alias set sw http://seaweedfs:8333 "$$S3_ACCESS_KEY" "$$S3_SECRET_KEY" &&
        mc mb --ignore-existing "sw/$$S3_BUCKET"
    restart: "no"

volumes:
  qdrant_data:
  seaweed_data:
  mysql_data:
  redis_data:

networks:
  dokploy-network:
    external: true
